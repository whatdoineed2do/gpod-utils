name: Build Debian Package

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential clang clang-tools autotools-dev autoconf libtool \
            libgpod-dev \
            libglib2.0-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libavutil-dev \
            libjson-c-dev dh-make

      - name: Build deb
        run: |
          fakeroot debian/rules binary

      - name: Get debs
        run: |
          DISTRO=$(echo "${{ matrix.os }}" | sed 's/ubuntu-/ubuntu/')
          for f in ../gpod-utils_*.deb; do
            base=$(basename "$f" .deb)
            arch="${base##*_}"
            prefix="${base%_*}"
            cp "$f" "${prefix}~${DISTRO}_${arch}.deb"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: gpod-utils_*.deb
